# Schlüssellose Tests des Kerns: Einheitstests mit nachgebildeten Gegenstellen und Paket-Probe (npm pack → Installation
# in einer separaten Beispielanwendung). Keine Secrets, keine Zahlungsdienste, keine Veröffentlichung.
# Integrationstests (integration/) und die Browser-Demo laufen hier bewusst nicht.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        express: [4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:paket -- --express ${{ matrix.express }}
